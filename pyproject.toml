[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "morning-news-podcast"
version = "0.1.0"
description = "毎朝自動配信ニュースポッドキャスト（VOICEVOX Core + Gemini）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.25.0",
    "feedparser>=6.0.11",
    "pyyaml>=6.0.2",
    "pydub>=0.25.1",
    "pydantic>=2.9.0",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
    "voicevox-core @ https://github.com/VOICEVOX/voicevox_core/releases/download/0.16.4/voicevox_core-0.16.4-cp310-abi3-manylinux_2_34_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "voicevox-core @ https://github.com/VOICEVOX/voicevox_core/releases/download/0.16.4/voicevox_core-0.16.4-cp310-abi3-manylinux_2_34_aarch64.whl ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "voicevox-core @ https://github.com/VOICEVOX/voicevox_core/releases/download/0.16.4/voicevox_core-0.16.4-cp310-abi3-macosx_11_0_arm64.whl ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "voicevox-core @ https://github.com/VOICEVOX/voicevox_core/releases/download/0.16.4/voicevox_core-0.16.4-cp310-abi3-macosx_10_12_x86_64.whl ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "voicevox-core @ https://github.com/VOICEVOX/voicevox_core/releases/download/0.16.4/voicevox_core-0.16.4-cp310-abi3-win_amd64.whl ; sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[project.scripts]
morning-news-podcast = "morning_news_podcast.main:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/morning_news_podcast"]

name: Daily Morning News Podcast

on:
  schedule:
    # 毎日 19:10 UTC (04:10 JST) に実行し、cron遅延を考慮しても 05:00 JST までに配信完了させる
    - cron: "10 19 * * *"
  workflow_dispatch: # 手動テスト実行用

permissions:
  contents: write

concurrency:
  group: "gh-pages-publish"
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup podcast environment and restore gh-pages
        uses: ./.github/actions/setup-podcast-env

      - name: Generate podcast episode and update RSS feed
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # カスタムドメインを使う場合は Repository Variables 等で PODCAST_BASE_URL を指定可能
          # PODCAST_BASE_URL: ${{ vars.PODCAST_BASE_URL }}
        run: uv run python main.py

      - name: Publish generated files to gh-pages branch
        uses: ./.github/actions/publish-gh-pages
        with:
          commit-prefix: "chore: publish daily podcast"
          date-format: "%Y-%m-%d"

name: Daily Morning News Podcast

on:
  schedule:
    # 毎日 19:10 UTC (04:10 JST) に実行し、cron遅延を考慮しても 05:00 JST までに配信完了させる
    - cron: "10 19 * * *"
  workflow_dispatch: # 手動テスト実行用

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies & voicevox_core
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install https://github.com/VOICEVOX/voicevox_core/releases/download/0.16.4/voicevox_core-0.16.4-cp310-abi3-manylinux_2_34_x86_64.whl

      - name: Cache VOICEVOX assets
        id: cache-voicevox
        uses: actions/cache@v4
        with:
          path: voicevox_assets
          key: voicevox-assets-0.16.4-ort1.17.3

      - name: Download VOICEVOX assets (ONNX Runtime, OpenJTalk dict, 0.vvm)
        if: steps.cache-voicevox.outputs.cache-hit != 'true'
        run: |
          mkdir -p voicevox_assets
          curl -sSfL https://github.com/VOICEVOX/onnxruntime-builder/releases/download/1.17.3/voicevox_onnxruntime-linux-x64-1.17.3.tgz -o ort.tgz
          tar -xzf ort.tgz -C voicevox_assets --strip-components=1
          rm ort.tgz

          curl -sSfL https://github.com/r9y9/open_jtalk/releases/download/1.11.1/open_jtalk_dic_utf_8-1.11.tar.gz -o dict.tar.gz
          tar -xzf dict.tar.gz -C voicevox_assets
          rm dict.tar.gz

          curl -sSfL https://github.com/VOICEVOX/voicevox_vvm/releases/download/0.16.4/0.vvm -o voicevox_assets/0.vvm

      - name: Generate podcast episode and update RSS feed
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # カスタムドメインを使う場合は Repository Variables 等で PODCAST_BASE_URL を指定可能
          # PODCAST_BASE_URL: ${{ vars.PODCAST_BASE_URL }}
        run: |
          python main.py

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            TZ=Asia/Tokyo date_str=$(date +"%Y-%m-%d")
            git commit -m "chore: publish daily podcast (${date_str})"
            git push
          fi

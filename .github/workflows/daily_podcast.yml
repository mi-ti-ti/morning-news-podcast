name: Daily Morning News Podcast

on:
  schedule:
    # 毎日 19:10 UTC (04:10 JST) に実行し、cron遅延を考慮しても 05:00 JST までに配信完了させる
    - cron: "10 19 * * *"
  workflow_dispatch: # 手動テスト実行用

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: uv sync --no-dev

      - name: Cache VOICEVOX assets
        id: cache-voicevox
        uses: actions/cache@v4
        with:
          path: voicevox_assets
          key: voicevox-assets-0.16.4-ort1.17.3

      - name: Download VOICEVOX assets (ONNX Runtime, OpenJTalk dict, 0.vvm)
        if: steps.cache-voicevox.outputs.cache-hit != 'true'
        run: uv run python voicevox_setup.py

      - name: Generate podcast episode and update RSS feed
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # カスタムドメインを使う場合は Repository Variables 等で PODCAST_BASE_URL を指定可能
          # PODCAST_BASE_URL: ${{ vars.PODCAST_BASE_URL }}
        run: uv run python main.py

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            TZ=Asia/Tokyo date_str=$(date +"%Y-%m-%d")
            git commit -m "chore: publish daily podcast (${date_str})"
            git push
          fi
